<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cadenza</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark light; --bg: oklch(0.17 0.012 255); --text: oklch(0.965 0.005 255); --text-off: oklch(0.7 0.012 255); }
  @media (prefers-color-scheme: light) { :root { --bg: oklch(0.97 0.006 255); --text: oklch(0.2 0.015 255); --text-off: oklch(0.47 0.012 255); } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    background: var(--bg); color: var(--text); font: 400 16px/1.45 'Segoe UI', system-ui, sans-serif; text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { margin: 14px 0 4px; font-size: 22px; }
  p { margin: 0; color: var(--text-off); }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>Cadenza</h1>
  <p>Song links shared from Cadenza open here.</p>
</main>
</body>
</html>
